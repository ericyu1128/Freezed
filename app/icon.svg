      <line x1="0" y1="13" x2="-4.5" y2="8.5" />
      <line x1="0" y1="13" x2="4.5" y2="8.5" />
      <line x1="0" y1="-6.5" x2="-3.2" y2="-3.4" />
      <line x1="0" y1="6.5" x2="3.2" y2="3.4" />
